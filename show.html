<!DOCTYPE html>
<html lang="en">
<head>
<title>Album Release Show</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="icon" type="image/x-icon" href="./Images/logowhite.png">
<style>
body{
  font-family: "Courier Prime", monospace; background-color:rgb(17, 17, 17); color:white;
  background-image:url("./Images/texture.png"), url("./Images/texture0.png"); background-blend-mode:lighten, darken;
  }
.mySlides {display: none}
h2 {font-family: "Courier Prime", monospace}
div{opacity:0.75; transition-property: opacity; transition-duration: 1s; transition-timing-function:east-out;}
div:hover{opacity:1;}
</style>
</head> 
<body>
<audio id="gossamer" src="./gossamerbg.mp3" preload="auto"></audio>

<!-- Navbar -->
<div class="w3-top">
  <div class="w3-bar w3-black w3-card">
    <a class="w3-bar-item w3-button w3-padding-large w3-hide-medium w3-hide-large w3-right" href="javascript:void(0)" onclick="myFunction()" title="Toggle Navigation Menu"><i class="fa fa-bars"></i></a>
    <a href="./index.html" class="w3-bar-item w3-button w3-padding-large">HOME</a>
    <a href="./index.html#Shows" class="w3-bar-item w3-button w3-padding-large w3-hide-small">SHOWS</a>
    <a href="./index.html#Contact" class="w3-bar-item w3-button w3-padding-large w3-hide-small">CONTACT</a>
    <a href="./index.html#Merch" class="w3-bar-item w3-button w3-padding-large w3-hide-small">MERCH</a>
    <div class="w3-dropdown-hover w3-hide-small">
      <button class="w3-padding-large w3-button" title="Music">MUSIC <i class="fa fa-caret-down"></i></button>     
      <div class="w3-dropdown-content w3-black w3-bar-block w3-card-4">
        <a href="https://overhand.bandcamp.com/music" class="w3-bar-item w3-button">LISTEN</a>
        <a href="https://www.youtube.com/@overhandwi" class="w3-bar-item w3-button">VIDEOS</a>
        <a href="./lyrics.html" class="w3-bar-item w3-button">LYRICS</a>
      </div>
    </div>
    <div class="w3-padding-large w3-hide-small w3-right">
      <img src="./Images/logowhiteheader.png" style="width:80px">
    </div>
  </div>
</div>

<!-- Navbar on small screens (remove the onclick attribute if you want the navbar to always show on top of the content when clicking on the links) -->
<div id="navDemo" class="w3-bar-block w3-black w3-hide w3-hide-large w3-hide-medium w3-top" style="margin-top:46px">
  <a href="./index.html#Shows" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">SHOWS</a>
  <a href="./index.html#Contact" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">CONTACT</a>
  <a href="./index.html#Merch" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">MERCH</a>
  <a href="https://overhand.bandcamp.com/music" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">LISTEN</a>
  <a href="https://www.youtube.com/@overhandwi" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">VIDEOS</a>
  <a href="./lyrics.html" class="w3-bar-item w3-button w3-padding-large" onclick="myFunction()">LYRICS</a>  
</div>

<!-- Page content -->
<div class="w3-content" style="max-width:2000px;margin-top:46px ">
    
  <!-- Poster -->
  <div class="w3-container w3-content w3-center w3-padding-32" style="max-width:800px" id="Poster"> 
    <img id="poster" src="./Images/poster.jpeg" style="width:75%">
  </div>

 <!-- Event details -->
   <div class="w3-container w3-content w3-center w3-padding-16" style="max-width:800px" id="Gouge"> 
     <p style="font-size:16px" class="w3-left-align">
        Overhand - Okay Omen - Frantic Repair - So Zuppy <br>
        <br>Friday, October 17, 2025<br>Doors 6:00PM / Music 7:00PM<br>All ages<br>
    </p>
   </div>

<!-- Footer -->
<footer class="w3-container w3-padding-16 w3-center w3-opacity w3-black w3-xlarge">
  <a href="https://www.instagram.com/overhandwi/?hl=en"><i class="fa fa-instagram w3-hover-opacity"></i></a>
  <a href="https://www.youtube.com/@overhandwi"><i class="fa fa-youtube w3-hover-opacity"></i></a>
  <a href="https://overhand.bandcamp.com/music"><i class="fa fa-bandcamp w3-hover-opacity"></i></a>
</footer>

<script>
// Used to toggle the menu on small screens when clicking on the menu button
function myFunction() {
  var x = document.getElementById("navDemo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else { 
    x.className = x.className.replace(" w3-show", "");
  }
}

// Play Gossamer background w/ mouse hover
var audio = document.getElementById("gossamer");
var hoverElement = document.getElementById("Poster"); //
Poster.addEventListener('mouseover', function() {
  audio.play(); 
});

</script>

</body>
</html>
